version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Do not propose a release until it has been public for a few days. Freshly published
    # versions are where supply-chain compromises live, and pnpm enforces a similar gate.
    cooldown:
      default-days: 3
    groups:
      dev-tooling:
        patterns:
          [
            'typescript*',
            'eslint*',
            '@eslint/*',
            'prettier',
            'vitest*',
            'turbo',
            'tsx',
            'dependency-cruiser',
          ]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
