packages:
  - apps/*
  - packages/platform/*
  - packages/legal/*

# Dependency install scripts do not run unless explicitly allowed. esbuild's postinstall only
# swaps a JS shim for the native binary (a startup optimisation); it works without it, so it is
# denied on purpose rather than approved.
allowBuilds:
  esbuild: false

# Single source of truth for dependency versions. Packages reference these with
# `catalog:`. Versions are exact (no ranges); Dependabot proposes bumps.
catalog:
  # Toolchain
  # TypeScript is pinned to 6.0.x: typescript-eslint 8.x declares support for
  # `typescript <6.1.0`, and type-aware linting is non-negotiable here (see ADR-0002).
  typescript: 6.0.3
  '@types/node': 24.13.5
  vitest: 5.0.1
  eslint: 10.10.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.0
  prettier: 3.9.8
  turbo: 2.10.13
  dependency-cruiser: 18.3.1
  tsx: 4.23.13

  # Runtime
  parse5: 8.0.1
  zod: 4.6.5
  pino: 10.3.1
  uuid: 14.0.2
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/sdk-trace-base': 2.11.0
  '@opentelemetry/context-async-hooks': 2.11.0
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0
  '@radix-ui/react-dialog': 1.1.23
  lucide-react: 1.47.0
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.1
  jsdom: 30.1.0
  '@playwright/test': 1.63.0
